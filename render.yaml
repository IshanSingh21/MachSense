# Render Infrastructure Blueprint for MachSense Free Tier
services:
  # 1. FastAPI Predictive Maintenance Backend
  - type: web
    name: machsense-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -U pip && pip install -r requirements.txt
    startCommand: uvicorn machsense.api.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MACHSENSE_ENV
        value: production
      - key: PYTHONPATH
        value: ./src
