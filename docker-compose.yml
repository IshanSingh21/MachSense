version: '3.8'

services:
  # ==========================================
  # FastAPI Predictive Maintenance Backend
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: machsense-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MACHSENSE_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - WEB_CONCURRENCY=2
      - MACHSENSE_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - logs_volume:/app/logs
    networks:
      - machsense-network

  # ==========================================
  # Next.js Modern Industrial Control Center
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: machsense-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - machsense-network

volumes:
  logs_volume:
    driver: local

networks:
  machsense-network:
    driver: bridge
